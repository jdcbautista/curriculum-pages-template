<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Curriculum Template</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/themes/vue.css">
  <style>
    :root { --theme-color: #2f6f5e; }
    .markdown-section { max-width: 780px; }
    details { margin: 1em 0; padding: .5em 1em; border: 1px solid #d0d7de; border-radius: 6px; }
    summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    // SITE SETTINGS: the only code you edit. Everything else is Markdown.
    window.$docsify = {
      name: 'Curriculum Template',                          // site title
      repo: 'jdcbautista/curriculum-pages-template',        // GitHub corner link ('' hides it)
      homepage: 'home.md',                                  // landing page
      loadSidebar: true,                                    // navigation comes from _sidebar.md
      subMaxLevel: 2,
      auto2top: true,
      search: { placeholder: 'Search', noData: 'No match' },
      pagination: { crossChapter: true, crossChapterText: true }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4.13.1/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2.10.1/dist/docsify-pagination.min.js"></script>
</body>
</html>
